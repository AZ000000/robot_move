        <button id="btn-reset" style="flex:1">↺ RESET</button>

        <button id="cmd-send" class="primary" style="flex:1">SEND</button>

        <button class="preset-btn" data-cmd="CMD:MOV,v=0.40,ω=0.80">

        <button class="preset-btn" data-cmd="CMD:MOV,v=0.40,ω=-0.80">

        <button class="preset-btn" data-cmd="CMD:MOV,v=0.00,ω=1.50">
